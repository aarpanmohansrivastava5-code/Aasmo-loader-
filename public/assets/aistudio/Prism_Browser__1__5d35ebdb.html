<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prism Browser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;--bg1:#000;--bg2:#07070c;
  --b1:#5b6cff;--b2:#ff6fa8;--b3:#27d3c3;--b4:#ffb454;
  --glass:rgba(255,255,255,.055);--glass-hi:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.38);--edge-lo:rgba(255,255,255,.06);
  --text:#fff;--muted:rgba(255,255,255,.66);
  --shadow:0 24px 60px rgba(0,0,0,.8);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.32;animation:drift 22s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;background:var(--b1);left:-12vmax;top:-14vmax}
.o2{width:38vmax;height:38vmax;background:var(--b2);right:-10vmax;top:18vh;animation-duration:27s}
.o3{width:34vmax;height:34vmax;background:var(--b3);left:22vw;bottom:-18vmax;animation-duration:31s}
.o4{width:20vmax;height:20vmax;background:var(--b4);right:26vw;top:-6vmax;animation-duration:19s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.glass{
  background:linear-gradient(145deg,var(--glass-hi),var(--glass) 40%,var(--glass));
  backdrop-filter:blur(26px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.06);
  border:1px solid var(--edge-lo);
  box-shadow:inset 0 1.5px 0 var(--edge),inset 0 -1px 0 var(--edge-lo),inset 1px 0 0 var(--edge-lo),var(--shadow);
}
.app{position:relative;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px;max-width:1200px;margin:0 auto}
.chrome{border-radius:28px;padding:8px 10px 10px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 1 190px;min-width:110px;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:999px;
  border:1px solid transparent;background:transparent;color:var(--muted);font:500 13px 'Figtree',system-ui,sans-serif;cursor:pointer;transition:background .25s,color .25s}
.tab:hover{background:var(--glass)}
.tab.on{color:var(--text);background:var(--glass-hi);border-color:var(--edge-lo);box-shadow:inset 0 1px 0 var(--edge),0 6px 16px rgba(0,0,0,.18)}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:conic-gradient(var(--b1),var(--b2),var(--b4),var(--b3),var(--b1))}
.x,.ib{border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;border-radius:50%}
.x{width:20px;height:20px;font-size:14px;line-height:1;opacity:.7}
.x:hover{background:var(--glass-hi);opacity:1}
.ib{width:36px;height:36px;color:var(--text);transition:background .2s,transform .15s}
.ib:hover{background:var(--glass-hi)}.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:disabled{opacity:.35;cursor:default;background:none}
.bar{display:flex;align-items:center;gap:4px}
.omni{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border-radius:999px;
  background:rgba(0,0,0,.14);box-shadow:inset 0 2px 6px rgba(0,0,0,.22),inset 0 -1px 0 var(--edge-lo);transition:box-shadow .25s,background .25s}
.omni:focus-within{background:rgba(0,0,0,.08);box-shadow:inset 0 2px 6px rgba(0,0,0,.18),0 0 0 2px var(--b1),0 0 28px rgba(91,108,255,.55)}
.omni svg{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.omni input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:500 15px 'Figtree',system-ui,sans-serif}
.omni input::placeholder{color:var(--muted)}
.marks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 4px}
.marks::-webkit-scrollbar{display:none}
.mk{flex:none;display:flex;align-items:center;gap:7px;padding:5px 11px 5px 6px;border-radius:999px;border:0;background:transparent;color:var(--muted);font:500 12.5px 'Figtree',system-ui,sans-serif;cursor:pointer}
.mk:hover{background:var(--glass);color:var(--text)}
.mk i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px 'Figtree',sans-serif;font-style:normal;color:#fff}
.view{flex:1;min-height:0;border-radius:28px;overflow:auto;display:grid;place-items:center;padding:28px 18px}
.home{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.clock{font:700 clamp(64px,14vw,120px)/1 'Figtree',system-ui,sans-serif;letter-spacing:-.045em;
  background:linear-gradient(180deg,var(--text),var(--muted));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello{color:var(--muted);font-size:17px;margin-top:-8px}
.search{width:100%;display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 20px;border-radius:999px}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:500 17px 'Figtree',system-ui,sans-serif}
.search input::placeholder{color:var(--muted)}
.go{height:42px;padding:0 20px;border:0;border-radius:999px;color:#fff;font:600 14px 'Figtree',system-ui,sans-serif;cursor:pointer;
  background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 18px rgba(91,108,255,.45)}
.dial{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.tile{border-radius:24px;padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;color:var(--text);cursor:pointer;
  font:500 13px 'Figtree',system-ui,sans-serif;transition:transform .2s}
.tile:hover{transform:translateY(-3px)}
.tile i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 19px 'Figtree',sans-serif;font-style:normal;color:#fff;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 6px 14px rgba(0,0,0,.25)}
.page{max-width:520px;padding:28px;border-radius:26px;text-align:center}
.page h2{font-size:22px;margin-bottom:8px}
.page p{color:var(--muted);line-height:1.5;font-size:15px;overflow-wrap:anywhere}
.theme{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:5}
button:focus-visible,input:focus-visible{outline:2px solid var(--b3);outline-offset:2px}
:root{--snap:cubic-bezier(.16,1,.3,1)}
.ib,.tile,.go,.mk,.tab{position:relative;overflow:hidden}
.chrome{animation:drop .55s var(--snap)}
@keyframes drop{from{transform:translateY(-130%)}}
.view>*{animation:wipe .5s var(--snap)}
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:0}}
.tab{transition:background .1s,color .1s,transform .2s var(--snap)}
.tab:active{transform:scale(.93)}
.tab.new{animation:tabIn .35s var(--snap)}
@keyframes tabIn{from{transform:scale(.3);opacity:0}}
.tab.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:linear-gradient(90deg,var(--b1),var(--b2));box-shadow:0 0 10px var(--b2);animation:bar .3s var(--snap)}
@keyframes bar{from{transform:scaleX(0)}}
.omni{transition:box-shadow .12s var(--snap),transform .2s var(--snap),background .12s}
.omni:focus-within{transform:scale(1.012)}
.dial .tile{transition:transform .18s var(--snap),box-shadow .18s;animation:pop .5s var(--snap) backwards;animation-delay:calc(var(--i)*50ms + 180ms)}
@keyframes pop{from{transform:translateY(26px) scale(.8);opacity:0;clip-path:inset(0 0 100% 0)}}
.tile:hover{transform:translateY(-6px) scale(1.05);box-shadow:inset 0 1.5px 0 var(--edge),0 0 0 1px var(--b1),0 14px 34px rgba(91,108,255,.35)}
.tile::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);pointer-events:none}
.tile:hover::after{animation:sheen .55s var(--snap)}
@keyframes sheen{to{left:130%}}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .5s var(--snap) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.go:hover{filter:brightness(1.2) saturate(1.2)}
@media (max-width:560px){.dial{grid-template-columns:repeat(2,1fr)}.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>

<div class="app">
  <header class="chrome glass">
    <div class="tabs" id="tabs"></div>
    <div class="bar">
      <button class="ib" id="back" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="ib hide-s" id="fwd" aria-label="Forward" disabled><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="ib" id="reload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button>
      <div class="omni">
        <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input id="omni" type="text" placeholder="Search or enter address" autocomplete="off" spellcheck="false" aria-label="Address bar">
        <button class="ib" id="star" aria-label="Bookmark this page"><svg viewBox="0 0 24 24"><path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.5-.8z"/></svg></button>
      </div>
      <button class="ib" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
    <div class="marks" id="marks"></div>
  </header>
  <main class="view glass" id="view"></main>
</div>



<script>
const SITES=[
  {n:'YouTube',u:'youtube.com',c:'#ff4d4d',l:'Y'},
  {n:'Gmail',u:'mail.google.com',c:'#ff8a3d',l:'G'},
  {n:'GitHub',u:'github.com',c:'#6b5bff',l:'H'},
  {n:'Wikipedia',u:'wikipedia.org',c:'#27a8b8',l:'W'},
  {n:'Maps',u:'maps.google.com',c:'#2fbf71',l:'M'},
  {n:'Reddit',u:'reddit.com',c:'#ff6a2b',l:'R'},
  {n:'Drive',u:'drive.google.com',c:'#e0a82e',l:'D'},
  {n:'AI Studio',u:'aistudio.google.com',c:'#4b7bff',l:'A'}
];
let tabs=[],active=0,uid=0;
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function newTab(){tabs.push({id:++uid,title:'New tab',url:'',fresh:1});active=tabs.length-1;draw();setTimeout(()=>tabs.forEach(t=>t.fresh=0),400)}
function closeTab(i){tabs.splice(i,1);if(!tabs.length){newTab();return}
  if(active>=tabs.length)active=tabs.length-1;draw()}
function go(raw){
  raw=raw.trim();if(!raw)return;
  const isUrl=/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/.*)?$/i.test(raw);
  const t=tabs[active];
  t.url=isUrl?raw.replace(/^https?:\/\//,''):'';
  t.q=isUrl?'':raw;
  t.title=isUrl?t.url.split('/')[0]:raw;
  draw()}

function draw(){
  $('tabs').innerHTML=tabs.map((t,i)=>`<button class="tab ${i===active?'on':''}${t.fresh?' new':''}" data-i="${i}"><span class="dot"></span><span class="t">${esc(t.title)}</span><span class="x" data-x="${i}" role="button" aria-label="Close tab">×</span></button>`).join('')
    +'<button class="ib" id="add" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>';
  const t=tabs[active];
  $('omni').value=t.url||t.q||'';
  $('view').innerHTML=(t.url||t.q)?pageHTML(t):homeHTML();
  if(!(t.url||t.q))wireHome();
  tick();
}
function pageHTML(t){
  return `<div class="page glass"><h2>${esc(t.title)}</h2><p>${t.url?'This is where your browser’s web view will render '+esc(t.url)+'.':'Search results for “'+esc(t.q)+'” will appear here.'}</p></div>`}
function homeHTML(){
  return `<div class="home"><div><div class="clock" id="clock"></div><p class="hello" id="hello"></p></div>
  <form class="search glass" id="sf"><input id="sq" placeholder="Search the web" autocomplete="off" aria-label="Search"><button class="go" type="submit">Search</button></form>
  <div class="dial">${SITES.map((s,i)=>`<button class="tile glass" style="--i:${i}" data-u="${s.u}"><i style="background:${s.c}">${s.l}</i>${s.n}</button>`).join('')}</div></div>`}
function wireHome(){
  $('sf').onsubmit=e=>{e.preventDefault();go($('sq').value)};
  document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>go(b.dataset.u));
}
function tick(){
  const c=$('clock');if(!c)return;
  const d=new Date(),h=d.getHours();
  c.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  $('hello').textContent=(h<5?'Still up?':h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' — what are you looking for?';
}

$('tabs').onclick=e=>{
  const x=e.target.closest('[data-x]');
  if(x){closeTab(+x.dataset.x);return}
  const b=e.target.closest('.tab');if(b){active=+b.dataset.i;draw();return}
  if(e.target.closest('#add'))newTab();
};
$('omni').addEventListener('keydown',e=>{if(e.key==='Enter')go(e.target.value)});
$('reload').onclick=draw;
$('marks').innerHTML=SITES.slice(0,6).map(s=>`<button class="mk" data-u="${s.u}"><i style="background:${s.c}">${s.l}</i>${s.n}</button>`).join('');
$('marks').onclick=e=>{const b=e.target.closest('.mk');if(b)go(b.dataset.u)};
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.ib,.tile,.go,.mk,.tab');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*2.2,p=document.createElement('span');
  p.className='rip';p.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  b.appendChild(p);setTimeout(()=>p.remove(),500)});
setInterval(tick,20000);
newTab();
</script>
</body>
</html>
